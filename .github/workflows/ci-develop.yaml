name: Lint HTML & CSS

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install linters
        run: |
          npm init -y
          npm install --save-dev htmlhint stylelint stylelint-config-standard

      - name: Run HTMLHint
        run: npx htmlhint "**/*.html" --config .htmlhintrc.json

      - name: Run Stylelint
        run: npx stylelint "**/*.css" --config .stylelintrc.json
